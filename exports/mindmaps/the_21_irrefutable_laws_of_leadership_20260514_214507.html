<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>the_21_irrefutable_laws_of_leadership</title>
<style>body{{margin:0;background:var(--rk-canvas,#0d1225);}}
.rk-dot{{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rk-primary-soft,#818cf8);margin:0 2px;animation:rk-dot-bounce 1.3s ease-in-out infinite;}}@keyframes rk-dot-bounce{{0%,80%,100%{{transform:translateY(0);opacity:.4}}40%{{transform:translateY(-7px);opacity:1}}}}</style>
</head>
<body>

<div id="rkmm2" class="rk-mindmap-tree">
  <style>
    #rkmm2 {
      --mm-bg:#060b18;
      --mm-panel:#0b1220;
      --mm-canvas:#0a1020;
      --mm-toolbar:#0d1426;
      --mm-surface-1:#111827;
      --mm-surface-2:#172033;
      --mm-surface-3:#1e293b;
      --mm-border-soft:#1e293b;
      --mm-border-strong:#334155;
      --mm-text:#f1f5f9;
      --mm-text-soft:#cbd5e1;
      --mm-text-muted:#94a3b8;
      --mm-text-dim:#64748b;
      --mm-primary:#4F46E5;
      --mm-primary-text:#c7d2fe;
      --mm-primary-surface:rgba(79,70,229,0.16);
      --mm-shadow:rgba(0,0,0,0.38);
      color:var(--mm-text);
      font-family:Aptos, "Segoe UI", system-ui, sans-serif;
    }
    #rkmm2 * { box-sizing:border-box; }
    #rkmm2.rk-mindmap-tree {
      background:linear-gradient(180deg, rgba(15,23,42,0.96), rgba(6,11,24,0.98));
      border:1px solid var(--mm-border-strong);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 18px 45px var(--mm-shadow);
    }
    #rkmm2 .mm-toolbar {
      min-height:58px;
      padding:12px 16px;
      background:linear-gradient(180deg, #0f172a, #0b1220);
      border-bottom:1px solid var(--mm-border-soft);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }
    #rkmm2 .mm-title-block { min-width:220px; }
    #rkmm2 .mm-eyebrow {
      color:var(--mm-text-dim);
      font-size:10px;
      font-weight:800;
      letter-spacing:0.14em;
      text-transform:uppercase;
      margin-bottom:4px;
    }
    #rkmm2 .mm-title {
      color:var(--mm-text);
      font-size:16px;
      line-height:1.25;
      font-weight:800;
    }
    #rkmm2 .mm-title span {
      color:var(--mm-primary-text);
      font-size:12px;
      font-weight:700;
      margin-left:8px;
      white-space:nowrap;
    }
    #rkmm2 .mm-actions {
      display:flex;
      gap:7px;
      align-items:center;
      flex-wrap:wrap;
    }
    #rkmm2 .mm-btn {
      background:var(--mm-surface-1);
      color:var(--mm-text-soft);
      border:1px solid var(--mm-border-strong);
      border-radius:8px;
      min-height:30px;
      padding:0 11px;
      font:700 12px/1 Aptos, "Segoe UI", sans-serif;
      cursor:pointer;
      transition:background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
    }
    #rkmm2 .mm-btn:hover {
      background:var(--mm-primary-surface);
      border-color:var(--mm-primary);
      color:var(--mm-primary-text);
    }
    #rkmm2 .mm-btn:active { transform:translateY(1px); }
    #rkmm2 .mm-btn-primary {
      border-color:rgba(79,70,229,0.7);
      color:var(--mm-primary-text);
    }
    #rkmm2 .mm-viewport {
      background:
        linear-gradient(90deg, rgba(15,23,42,0.82) 0 1px, transparent 1px) 0 0/28px 28px,
        linear-gradient(0deg, rgba(15,23,42,0.82) 0 1px, transparent 1px) 0 0/28px 28px,
        var(--mm-canvas);
      overflow:auto;
      max-height:760px;
      min-height:520px;
    }
    #rkmm2 .mm-stage {
      transform-origin:top left;
      transition:transform .18s ease;
      min-width:980px;
      padding:24px;
      display:grid;
      grid-template-columns:minmax(245px, 310px) minmax(580px, 1fr);
      gap:26px;
      align-items:start;
    }
    #rkmm2 .mm-root-card {
      position:sticky;
      top:20px;
      background:linear-gradient(180deg, rgba(30,41,59,0.96), rgba(15,23,42,0.98));
      border:1px solid rgba(79,70,229,0.42);
      border-radius:12px;
      padding:18px;
      box-shadow:0 18px 34px rgba(0,0,0,0.24);
    }
    #rkmm2 .mm-root-card::before {
      content:"";
      display:block;
      width:44px;
      height:4px;
      background:var(--mm-primary);
      border-radius:999px;
      margin-bottom:14px;
    }
    #rkmm2 .mm-root-label {
      color:var(--mm-text-dim);
      text-transform:uppercase;
      letter-spacing:0.12em;
      font-size:10px;
      font-weight:800;
      margin-bottom:6px;
    }
    #rkmm2 .mm-root-card h2 {
      margin:0;
      color:var(--mm-text);
      font-size:24px;
      line-height:1.15;
      letter-spacing:0;
    }
    #rkmm2 .mm-root-card p {
      margin:12px 0 0;
      color:var(--mm-text-muted);
      font-size:13px;
      line-height:1.55;
    }
    #rkmm2 .mm-branches {
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    #rkmm2 .mm-branch {
      position:relative;
      display:grid;
      grid-template-columns:28px minmax(0, 1fr);
      gap:12px;
      opacity:0;
      transform:translateY(8px);
      animation:mm-rise .36s ease forwards;
    }
    @keyframes mm-rise {
      to { opacity:1; transform:translateY(0); }
    }
    #rkmm2 .mm-rail {
      position:relative;
      min-height:100%;
    }
    #rkmm2 .mm-rail::before {
      content:"";
      position:absolute;
      left:13px;
      top:20px;
      bottom:-14px;
      width:2px;
      background:linear-gradient(180deg, var(--branch-accent), rgba(51,65,85,0.25));
      border-radius:999px;
      opacity:.72;
    }
    #rkmm2 .mm-rail::after {
      content:"";
      position:absolute;
      top:22px;
      left:7px;
      width:14px;
      height:14px;
      background:var(--branch-accent);
      border:3px solid var(--mm-canvas);
      border-radius:999px;
      box-shadow:0 0 0 1px rgba(255,255,255,0.14);
    }
    #rkmm2 .mm-branch-card {
      position:relative;
      display:grid;
      grid-template-columns:38px minmax(0, 1fr);
      background:rgba(17,24,39,0.92);
      border:1px solid var(--mm-border-soft);
      border-left:3px solid var(--branch-accent);
      border-radius:10px;
      box-shadow:0 10px 24px rgba(0,0,0,0.2);
      overflow:hidden;
    }
    #rkmm2 .mm-branch-toggle {
      appearance:none;
      background:rgba(15,23,42,0.8);
      border:0;
      border-right:1px solid var(--mm-border-soft);
      color:var(--mm-text-muted);
      cursor:pointer;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding-top:18px;
      font-size:13px;
      font-weight:800;
      transition:background .16s ease, color .16s ease;
    }
    #rkmm2 .mm-branch-toggle:hover {
      background:rgba(79,70,229,0.16);
      color:var(--mm-primary-text);
    }
    #rkmm2 .mm-chevron {
      display:inline-block;
      transform:rotate(0deg);
      transition:transform .2s ease;
    }
    #rkmm2 .mm-branch.collapsed .mm-chevron { transform:rotate(-90deg); }
    #rkmm2 .mm-branch-body {
      padding:15px 16px 16px;
      min-width:0;
    }
    #rkmm2 .mm-branch-kicker {
      color:var(--branch-accent);
      font-size:10px;
      font-weight:900;
      letter-spacing:0.12em;
      text-transform:uppercase;
      margin-bottom:5px;
    }
    #rkmm2 .mm-branch h3 {
      margin:0;
      color:var(--mm-text);
      font-size:17px;
      line-height:1.25;
      letter-spacing:0;
    }
    #rkmm2 .mm-branch p {
      margin:7px 0 12px;
      color:var(--mm-text-muted);
      font-size:12.5px;
      line-height:1.45;
    }
    #rkmm2 .mm-children {
      list-style:none;
      margin:0;
      padding:0;
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:8px;
      max-height:720px;
      overflow:hidden;
      transition:max-height .25s ease, opacity .2s ease, margin .2s ease;
    }
    #rkmm2 .mm-branch.collapsed .mm-children {
      max-height:0;
      opacity:0;
      margin-top:0;
    }
    #rkmm2 .mm-child {
      min-height:42px;
      display:grid;
      grid-template-columns:12px minmax(0, 1fr);
      gap:9px;
      align-items:start;
      background:rgba(15,23,42,0.72);
      border:1px solid rgba(51,65,85,0.74);
      border-radius:8px;
      padding:10px 11px;
    }
    #rkmm2 .mm-child-dot {
      width:7px;
      height:7px;
      margin-top:5px;
      border-radius:50%;
      background:var(--branch-accent);
      box-shadow:0 0 0 3px rgba(255,255,255,0.04);
    }
    #rkmm2 .mm-child-text {
      color:var(--mm-text-soft);
      font-size:12.5px;
      line-height:1.35;
      overflow-wrap:anywhere;
    }
    @media (max-width: 820px) {
      #rkmm2 .mm-stage {
        min-width:0;
        display:block;
        padding:14px;
      }
      #rkmm2 .mm-root-card {
        position:relative;
        top:auto;
        margin-bottom:14px;
      }
      #rkmm2 .mm-viewport {
        min-height:520px;
      }
      #rkmm2 .mm-children {
        grid-template-columns:1fr;
      }
    }
  </style>

  <div class="mm-toolbar">
    <div class="mm-title-block">
      <div class="mm-eyebrow">Study Tree</div>
      <div class="mm-title">the_21_irrefutable_laws_of_leadership<span>1 branches / 1 points</span></div>
    </div>
    <div class="mm-actions">
      <button class="mm-btn mm-btn-primary" onclick="window['rkmm2_expandAll']()">Expand All</button>
      <button class="mm-btn" onclick="window['rkmm2_collapseAll']()">Collapse All</button>
      <button class="mm-btn" onclick="window['rkmm2_fit']()">Fit</button>
      <button class="mm-btn" onclick="window['rkmm2_zoomOut']()">-</button>
      <button class="mm-btn" onclick="window['rkmm2_zoomIn']()">+</button>
      <button class="mm-btn" onclick="window['rkmm2_export']()">Export</button>
    </div>
  </div>

  <div class="mm-viewport" id="rkmm2_viewport">
    <div class="mm-stage" id="rkmm2_stage">
      <aside class="mm-root-card">
        <div class="mm-root-label">Main Topic</div>
        <h2>Study Map</h2>
        <p>Generated from the selected study material and organized as a readable review tree.</p>
      </aside>
      <main class="mm-branches">
        
        <section class="mm-branch" id="rkmm2_branch1" style="--branch-accent:#7c3aed;animation-delay:0ms;">
          <div class="mm-rail" aria-hidden="true"></div>
          <article class="mm-branch-card">
            <button class="mm-branch-toggle" onclick="window['rkmm2_toggle']('rkmm2_branch1')" title="Collapse branch">
              <span class="mm-chevron">v</span>
            </button>
            <div class="mm-branch-body">
              <div class="mm-branch-kicker">Branch 01 / 1 points</div>
              <h3>Review Needed</h3>
              <p>The model output could not be structured.</p>
              <ul class="mm-children">
                
            <li class="mm-child">
              <span class="mm-child-dot"></span>
              <span class="mm-child-text">Regenerate the mindmap</span>
            </li>
            
              </ul>
            </div>
          </article>
        </section>
        
      </main>
    </div>
  </div>
</div>

<script id="rkmm2_script">
(function() {
  var scale = 1;
  var stage = document.getElementById('rkmm2_stage');
  var viewport = document.getElementById('rkmm2_viewport');

  function branches() {
    return Array.prototype.slice.call(document.querySelectorAll('#rkmm2 .mm-branch'));
  }
  function applyScale() {
    if (stage) stage.style.transform = 'scale(' + scale + ')';
  }
  window['rkmm2_toggle'] = function(branchId) {
    var branch = document.getElementById(branchId);
    if (!branch) return;
    branch.classList.toggle('collapsed');
  }
  window['rkmm2_expandAll'] = function() {
    branches().forEach(function(branch) { branch.classList.remove('collapsed'); });
  }
  window['rkmm2_collapseAll'] = function() {
    branches().forEach(function(branch) { branch.classList.add('collapsed'); });
  }
  window['rkmm2_fit'] = function() {
    scale = 1;
    if (stage && viewport && stage.scrollWidth > viewport.clientWidth) {
      scale = Math.max(0.72, Math.min(1, (viewport.clientWidth - 28) / stage.scrollWidth));
    }
    applyScale();
    if (viewport) {
      viewport.scrollLeft = 0;
      viewport.scrollTop = 0;
    }
  }
  window['rkmm2_zoomIn']  = function() {
    scale = Math.min(1.3, +(scale + 0.08).toFixed(2));
    applyScale();
  }
  window['rkmm2_zoomOut'] = function() {
    scale = Math.max(0.72, +(scale - 0.08).toFixed(2));
    applyScale();
  }
  window['rkmm2_export'] = function() {
    var shell = document.getElementById('rkmm2');
    var script = document.getElementById('rkmm2_script');
    if (!shell) return;
    var html = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>the_21_irrefutable_laws_of_leadership</title></head><body style="margin:0;background:#060b18;padding:18px;">' + shell.outerHTML + (script ? script.outerHTML : '') + '</body></html>';
    var blob = new Blob([html], { type:'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'the_21_irrefutable_laws_of_leadership_tree.html';
    document.body.appendChild(a);
    a.click();
    setTimeout(function() {
      URL.revokeObjectURL(a.href);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 0);
  }
  setTimeout(window['rkmm2_fit'], 60);
})();
</script>

</body>
</html>
